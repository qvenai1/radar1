[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-scraper"
version = "3.0.0"
description = "Production-grade, long-running ADS-B Exchange area scraper"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "playwright>=1.61",
    "zstandard>=0.22",
    "shapely>=2.0",
    "pyproj>=3.6",
]

[project.optional-dependencies]
rest = ["aiohttp>=3.14"]        # OpenSky / ADS-B Exchange REST fallback strategies
metrics = ["psutil>=5.9"]       # richer memory sampling (falls back gracefully)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
adsb-scraper = "adsb_scraper.main:main"

[tool.setuptools.packages.find]
include = ["adsb_scraper*"]

[tool.setuptools.package-data]
adsb_scraper = ["data/*.geojson"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE", "ASYNC"]
ignore = [
    "E501",   # line length handled by formatter; long log strings are fine
]

[tool.ruff.lint.per-file-ignores]
"adsb_scraper/tests/*" = ["B011", "S101"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
plugins = []

[[tool.mypy.overrides]]
# shapely (2.x) ships no py.typed; the others are optional deps without stubs.
module = ["psutil.*", "aiohttp.*", "brotli.*", "shapely.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["adsb_scraper/tests"]
addopts = "-q"
