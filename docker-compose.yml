# TimescaleDB for Atheer RADAR — DEV convenience.
# This compose file exists so the database is reproducible and never pollutes
# the host. It is a *development* constraint artifact: production points the
# backend at a managed/self-hosted PostgreSQL+TimescaleDB instance purely via
# DATABASE_URL — nothing in the schema or app code assumes this container.
#
# Port 5435 is used because 5432/5433/5434/5544 are occupied on this dev
# machine by unrelated Postgres instances (dev constraint, not a design one).
#
# Usage:
#   cp .env.example .env   # fill POSTGRES_PASSWORD
#   docker compose up -d
#   .venv/bin/python migrate.py

services:
  timescaledb:
    image: timescale/timescaledb:2.28.2-pg17
    container_name: scraplan-timescaledb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: opensky
      POSTGRES_USER: opensky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensky -d opensky"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  timescale_data:
